<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="t d">
  <title id="t">Nanda Kishore R, Software Engineer (Backend)</title>
  <desc id="d">A request travelling through a backend: client, REST API, services, PostgreSQL, outbox, RabbitMQ and a worker, with packets flowing between them.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#94a3b8" stroke-opacity="0.07"/>
    </pattern>
    <radialGradient id="glow" cx="78%" cy="48%" r="42%">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="92%" cy="18%" r="30%">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <clipPath id="card"><rect width="1000" height="300" rx="18"/></clipPath>
    <!-- edge paths, reused by the dashed lines and the moving packets -->
    <path id="e1" d="M600 175 Q630 118 690 105"/>
    <path id="e2" d="M690 105 Q755 100 790 150"/>
    <path id="e3" d="M790 150 Q770 212 720 245"/>
    <path id="e4" d="M720 245 Q780 268 840 245"/>
    <path id="e5" d="M840 245 Q890 210 900 150"/>
    <path id="e6" d="M900 150 Q935 115 940 70"/>
    <path id="e7" d="M690 105 Q660 185 600 175"/>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="300" fill="#05070b"/>
    <rect width="1000" height="300" fill="url(#grid)"/>
    <rect width="1000" height="300" fill="url(#glow)"/>
    <rect width="1000" height="300" fill="url(#glow2)"/>

    <!-- links -->
    <g fill="none" stroke-width="1.6" stroke-dasharray="4 6">
      <use href="#e1" stroke="#5eead4" stroke-opacity="0.45"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.9s" repeatCount="indefinite"/></use>
      <use href="#e2" stroke="#5eead4" stroke-opacity="0.45"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.9s" repeatCount="indefinite"/></use>
      <use href="#e3" stroke="#60a5fa" stroke-opacity="0.45"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.9s" repeatCount="indefinite"/></use>
      <use href="#e4" stroke="#fbbf24" stroke-opacity="0.45"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.9s" repeatCount="indefinite"/></use>
      <use href="#e5" stroke="#fbbf24" stroke-opacity="0.45"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.9s" repeatCount="indefinite"/></use>
      <use href="#e6" stroke="#a78bfa" stroke-opacity="0.45"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.9s" repeatCount="indefinite"/></use>
      <use href="#e7" stroke="#dfe7f1" stroke-opacity="0.22"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="1.2s" repeatCount="indefinite"/></use>
    </g>

    <!-- packets: the request moves hop by hop, the response returns to the client -->
    <g>
      <circle r="3.2" fill="#5eead4"><animateMotion dur="1.6s" repeatCount="indefinite" begin="0s"><mpath href="#e1"/></animateMotion></circle>
      <circle r="3.2" fill="#5eead4"><animateMotion dur="1.6s" repeatCount="indefinite" begin="0.4s"><mpath href="#e2"/></animateMotion></circle>
      <circle r="3.2" fill="#60a5fa"><animateMotion dur="1.6s" repeatCount="indefinite" begin="0.8s"><mpath href="#e3"/></animateMotion></circle>
      <circle r="3.2" fill="#fbbf24"><animateMotion dur="1.6s" repeatCount="indefinite" begin="1.2s"><mpath href="#e4"/></animateMotion></circle>
      <circle r="3.2" fill="#fbbf24"><animateMotion dur="1.6s" repeatCount="indefinite" begin="1.6s"><mpath href="#e5"/></animateMotion></circle>
      <circle r="3.2" fill="#a78bfa"><animateMotion dur="1.6s" repeatCount="indefinite" begin="2s"><mpath href="#e6"/></animateMotion></circle>
      <circle r="2.6" fill="#dfe7f1" fill-opacity="0.8"><animateMotion dur="2.2s" repeatCount="indefinite" begin="1s"><mpath href="#e7"/></animateMotion></circle>
    </g>

    <!-- nodes -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" text-anchor="middle">
      <!-- client, with a pulse: every request starts here -->
      <circle cx="600" cy="175" r="7" fill="none" stroke="#dfe7f1" stroke-opacity="0.6">
        <animate attributeName="r" values="7;20" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.6;0" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="600" cy="175" r="11" fill="#dfe7f1" fill-opacity="0.25" filter="url(#soft)"/>
      <circle cx="600" cy="175" r="5.5" fill="#dfe7f1"/>
      <text x="600" y="203" fill="#9aa7b8">client</text>

      <circle cx="690" cy="105" r="12" fill="#5eead4" fill-opacity="0.3" filter="url(#soft)"/>
      <circle cx="690" cy="105" r="9" fill="#05070b" stroke="#5eead4" stroke-opacity="0.7"/>
      <circle cx="690" cy="105" r="4.5" fill="#5eead4"/>
      <text x="690" y="83" fill="#5eead4">REST API</text>

      <circle cx="790" cy="150" r="12" fill="#5eead4" fill-opacity="0.3" filter="url(#soft)"/>
      <rect x="780" y="142" width="20" height="16" rx="4" fill="#05070b" stroke="#5eead4" stroke-opacity="0.7"/>
      <circle cx="790" cy="150" r="3.5" fill="#5eead4"/>
      <text x="813" y="136" fill="#5eead4" text-anchor="start">services</text>

      <circle cx="720" cy="245" r="12" fill="#60a5fa" fill-opacity="0.3" filter="url(#soft)"/>
      <ellipse cx="720" cy="239" rx="10" ry="3.5" fill="#05070b" stroke="#60a5fa" stroke-opacity="0.8"/>
      <path d="M710 239 V251 A10 3.5 0 0 0 730 251 V239" fill="#05070b" stroke="#60a5fa" stroke-opacity="0.8"/>
      <ellipse cx="720" cy="239" rx="10" ry="3.5" fill="none" stroke="#60a5fa" stroke-opacity="0.8"/>
      <text x="720" y="275" fill="#60a5fa">PostgreSQL</text>

      <circle cx="840" cy="245" r="12" fill="#fbbf24" fill-opacity="0.28" filter="url(#soft)"/>
      <rect x="832" y="237" width="16" height="16" rx="3" fill="#05070b" stroke="#fbbf24" stroke-opacity="0.8" transform="rotate(45 840 245)"/>
      <text x="840" y="275" fill="#fbbf24">outbox</text>

      <circle cx="900" cy="150" r="12" fill="#fbbf24" fill-opacity="0.28" filter="url(#soft)"/>
      <circle cx="900" cy="150" r="10" fill="#05070b" stroke="#fbbf24" stroke-opacity="0.8"/>
      <g fill="#fbbf24">
        <rect x="892" y="147" width="4" height="6" rx="1"/>
        <rect x="898" y="147" width="4" height="6" rx="1"/>
        <rect x="904" y="147" width="4" height="6" rx="1" fill-opacity="0.5"/>
      </g>
      <text x="900" y="178" fill="#fbbf24">RabbitMQ</text>

      <circle cx="940" cy="70" r="12" fill="#a78bfa" fill-opacity="0.3" filter="url(#soft)"/>
      <polygon points="940,60 949,65 949,75 940,80 931,75 931,65" fill="#05070b" stroke="#a78bfa" stroke-opacity="0.85">
        <animateTransform attributeName="transform" type="rotate" from="0 940 70" to="360 940 70" dur="12s" repeatCount="indefinite"/>
      </polygon>
      <circle cx="940" cy="70" r="3" fill="#a78bfa"/>
      <text x="940" y="46" fill="#a78bfa">worker</text>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="999" height="299" rx="17.5" fill="none" stroke="#94a3b8" stroke-opacity="0.18"/>

  <!-- copy -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="56" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#7f8b9e">
      <tspan fill="#5eead4">GET</tspan> /whoami <tspan fill="#7f8b9e">→</tspan> <tspan fill="#4ade80">200 OK</tspan>
    </text>
    <rect x="232" y="70" width="8" height="15" fill="#5eead4">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <text x="54" y="148" font-size="50" font-weight="700" fill="#e7edf5" letter-spacing="-1.5">Nanda Kishore R<tspan fill="#5eead4">.</tspan></text>
    <text x="56" y="192" font-size="24" font-weight="500" fill="#e7edf5">Software Engineer <tspan fill="#7f8b9e">—</tspan> <tspan fill="#5eead4" font-style="italic">Backend</tspan></text>
    <text x="56" y="228" font-size="15" fill="#9aa7b8">Java 17 · Spring Boot · PostgreSQL · Python / FastAPI · RabbitMQ</text>
    <g transform="translate(56 248)">
      <rect width="206" height="26" rx="13" fill="#0b1019" stroke="#94a3b8" stroke-opacity="0.24"/>
      <circle cx="15" cy="13" r="4" fill="#4ade80"/>
      <circle cx="15" cy="13" r="4" fill="none" stroke="#4ade80">
        <animate attributeName="r" values="4;10" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.7;0" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="28" y="17.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#9aa7b8">open to backend roles</text>
    </g>
  </g>
</svg>
